name: build
on: [push]

# INFO: The following configuration block ensures that only one build runs per branch,
# which may be desirable for projects with a costly build process.
# Remove this block from the CI workflow to let each CI job run to completion.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/hlint-setup@v2
    - uses: haskell-actions/hlint-run@v2
      with:
        path: .
        fail-on: warning
  ormolu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/run-ormolu@v17
        with:
          version: "0.8.1.1"
  cabal-gild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cabal-gild
        run: |
          mkdir -p $HOME/.cabal/bin
          echo "$HOME/.cabal/bin" >> $GITHUB_PATH
          curl -sL https://github.com/tfausak/cabal-gild/releases/download/1.8.4.1/cabal-gild-1.8.4.1-linux-x64.tar.gz > cabal-gild.tar.gz
          tar -xzf cabal-gild.tar.gz
          chmod a+x cabal-gild
          mv cabal-gild $HOME/.cabal/bin/cabal-gild
          rm -f cabal-gild.tar.gz
      - name: Check cabal files are formatted
        run: cabal-gild --mode check *.cabal
  build:
    name: GHC ${{ matrix.ghc-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ghc-version: ['9.14', '9.12', '9.10']

    steps:
      - uses: actions/checkout@v4

      - name: Use CI project file
        run: cp cabal.project.ci cabal.project

      - name: Set up GHC ${{ matrix.ghc-version }}
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc-version }}

      - name: Configure the build
        run: |
          cabal --project-file=cabal.project.ci configure --enable-benchmarks --disable-documentation
          cabal --project-file=cabal.project.ci build --dry-run
        # The last step generates dist-newstyle/cache/plan.json for the cache key.

      - name: Restore cached dependencies
        uses: actions/cache/restore@v4
        id: cache
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        # If we had an exact cache hit, the dependencies will be up to date.
        if: steps.cache.outputs.cache-hit != 'true'
        run: cabal --project-file=cabal.project.ci build all --only-dependencies

      # Cache dependencies already here, so that we do not have to rebuild them should the subsequent steps fail.
      - name: Save cached dependencies
        uses: actions/cache/save@v4
        # If we had an exact cache hit, trying to save the cache would error because of key clash.
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: cabal --project-file=cabal.project.ci build all

      - name: Run circuits-net axioma
        run: cabal run circuits-net-axioma

      # CI-only control: mutate one predicate so the executable must fail.
      # This is not a failing test in the source tree; the trap restores it.
      - name: Deliberate failing control — axioma exit propagation
        id: axioma-failure-control
        if: matrix.ghc-version == '9.14'
        continue-on-error: true
        run: |
          cp app/axioma.hs "$RUNNER_TEMP/axioma.hs.before-control"
          trap 'cp "$RUNNER_TEMP/axioma.hs.before-control" app/axioma.hs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/axioma.hs")
          source = path.read_text()
          old = "if finalLoss < initialLoss / 2"
          assert source.count(old) == 1
          path.write_text(source.replace(old, "if False"))
          PY
          echo "DELIBERATE CONTROL: the first oracle is disabled; this step must fail."
          cabal run circuits-net-axioma

      - name: Confirm the deliberate control was observed as a failure
        if: success() && matrix.ghc-version == '9.14'
        run: |
          test '${{ steps.axioma-failure-control.outcome }}' = 'failure'
          git diff --exit-code -- app/axioma.hs

      - name: Check cabal file
        run: cabal check

      - name: cabal-docspec
        if: matrix.os == 'ubuntu-latest' && matrix.ghc-version == '9.14'
        run: |
          mkdir -p $HOME/.cabal/bin
          echo "$HOME/.cabal/bin" >> $GITHUB_PATH
          curl -sL https://github.com/phadej/cabal-extras/releases/download/cabal-docspec-0.0.0.20250606/cabal-docspec-0.0.0.20250606-x86_64-linux.xz > cabal-docspec.xz
          xz -d < cabal-docspec.xz > $HOME/.cabal/bin/cabal-docspec
          rm -f cabal-docspec.xz
          chmod a+x $HOME/.cabal/bin/cabal-docspec
          $HOME/.cabal/bin/cabal-docspec --version
          cabal-docspec
